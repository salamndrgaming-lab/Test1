<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NewsScope">
  <defs>
    <clipPath id="ns-lens">
      <circle cx="256" cy="256" r="148"/>
    </clipPath>
    <linearGradient id="ns-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="ns-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="65%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="114" fill="#0a0d13"/>

  <!-- the lens: left / center / right of the spectrum -->
  <g clip-path="url(#ns-lens)">
    <rect x="80"  y="80" width="130" height="352" fill="#2563eb"/>
    <rect x="210" y="80" width="92"  height="352" fill="#e7ecf3"/>
    <rect x="302" y="80" width="140" height="352" fill="#dc2626"/>
    <ellipse cx="256" cy="150" rx="152" ry="92" fill="url(#ns-gloss)"/>
  </g>

  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#ns-ring)" stroke-width="24"/>
</svg>
